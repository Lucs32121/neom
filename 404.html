<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada | NEOM</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070a;--surface:#111114;--text:#f5f5f0;--muted:#a3a39b;--line:#26261f;
  --accent:#e8ff1a;--accent-ink:#0a0a0a;--glow:rgba(232,255,26,.45);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0a0a;--surface:#141414;--text:#f5f5f0;--muted:#a3a39b;--line:#262622;
    --accent:#e8ff1a;--accent-ink:#0a0a0a;--glow:rgba(232,255,26,.28);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0a0a;--surface:#141414;--text:#f5f5f0;--muted:#a3a39b;--line:#262622;
  --accent:#e8ff1a;--accent-ink:#0a0a0a;--glow:rgba(232,255,26,.28);color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
h1,h2,h3{font-family:"Space Grotesk",Inter,system-ui,sans-serif;line-height:1.1;margin:0;letter-spacing:-.02em}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid var(--line);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 24px var(--glow)}
.btn-ghost{background:transparent;color:var(--text)}
/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:49}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:24px;letter-spacing:.06em}
.logo span{color:var(--accent);text-shadow:0 0 14px var(--glow)}
.links{display:flex;gap:28px;font-size:14px;color:var(--muted)}
.links a:hover{color:var(--text)}
.nav .btn{padding:9px 18px;font-size:14px}
@media(max-width:720px){.links{display:none}}
/* hero */
.hero{padding:64px 0 72px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:520px;height:520px;right:-120px;top:-60px;background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;position:relative}
.hero h1{font-size:clamp(38px,6vw,68px)}
.hero h1 em{font-style:normal;color:var(--accent);text-shadow:0 0 28px var(--glow)}
.hero p.lead{font-size:18px;color:var(--muted);max-width:520px;margin:20px 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:36px;margin-top:40px}
.stats b{display:block;font-family:"Space Grotesk",sans-serif;font-size:28px;color:var(--accent)}
.stats span{font-size:13px;color:var(--muted)}
/* laptop mockup */
.laptop{position:relative;filter:drop-shadow(0 0 30px var(--glow))}
.screen{border:3px solid var(--accent);border-radius:14px 14px 4px 4px;background:#0b0b0b;padding:14px;aspect-ratio:16/10}
.bar{display:flex;gap:6px;margin-bottom:12px}
.bar i{width:8px;height:8px;border-radius:50%;background:#333}
.bar i:first-child{background:var(--accent)}
.mock-h{height:14px;width:62%;background:#f1f1ea;border-radius:4px;margin-bottom:8px}
.mock-h.s{width:40%;background:var(--accent)}
.mock-p{height:6px;width:80%;background:#2d2d2a;border-radius:3px;margin:6px 0}
.mock-p.m{width:68%}
.mock-btn{width:84px;height:22px;background:var(--accent);border-radius:999px;margin:14px 0}
.mock-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.mock-cards div{height:46px;border:1px solid #2d2d2a;border-radius:6px;background:#141414}
.base{height:12px;margin:0 -6%;border-radius:0 0 18px 18px;background:linear-gradient(#cfcfc6,#8d8d85)}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}.hero{padding-top:40px}}
/* sections */
section{padding:80px 0}
.eyebrow{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;margin-bottom:12px}
.sec-head{text-align:center;max-width:620px;margin:0 auto 48px}
.sec-head h2{font-size:clamp(30px,4.5vw,44px)}
.sec-head p{color:var(--muted);margin:14px 0 0}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch}
.plan{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 26px}
.plan.hot{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 36px var(--glow)}
.tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:4px 14px;border-radius:999px;white-space:nowrap}
.plan h3{font-size:24px}
.plan .sub{color:var(--muted);font-size:14px;margin:6px 0 20px}
.price{font-family:"Space Grotesk",sans-serif;font-size:38px;font-weight:700}
.plan .inst{font-size:13px;color:var(--muted);margin:2px 0 22px}
.plan ul{list-style:none;padding:0;margin:0 0 28px;flex:1}
.plan li{display:flex;gap:10px;font-size:14.5px;padding:6px 0}
.plan li::before{content:"✓";color:var(--accent);font-weight:700}
.plan .btn{width:100%}
.plan:not(.hot) .btn{background:transparent;color:var(--text)}
.plan:not(.hot) .btn:hover{border-color:var(--accent)}
@media(max-width:900px){.plans{grid-template-columns:1fr;max-width:460px;margin:0 auto}}
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:56px}
.feat{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--surface)}
.feat .ic{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;margin-bottom:14px;box-shadow:0 0 14px var(--glow),inset 0 0 12px var(--glow);filter:drop-shadow(0 0 4px var(--accent))}.feat .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.feat h3{font-size:17px;margin-bottom:6px}
.feat p{margin:0;font-size:14px;color:var(--muted)}
@media(max-width:900px){.feats{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.feats{grid-template-columns:1fr}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.step{border-top:2px solid var(--line);padding-top:18px}
.step:hover{border-color:var(--accent)}
.step .n{font-family:"Space Grotesk",sans-serif;font-size:44px;font-weight:700;color:var(--accent);opacity:.9}
.step h3{font-size:20px;margin:6px 0}
.step p{margin:0;color:var(--muted);font-size:14.5px}
@media(max-width:860px){.steps{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.steps{grid-template-columns:1fr}}
.faq{max-width:760px;margin:0 auto}
details{border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:12px;padding:0 22px}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-weight:600;font-family:"Space Grotesk",sans-serif;font-size:18px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:24px;transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{margin:0 0 18px;color:var(--muted);font-size:15px}
.final{text-align:center;border:1px solid var(--accent);border-radius:28px;padding:64px 24px;background:radial-gradient(circle at 50% 0,var(--glow),transparent 70%),var(--surface);box-shadow:0 0 44px var(--glow)}
.final h2{font-size:clamp(30px,5vw,48px)}
.final p{color:var(--muted);max-width:480px;margin:14px auto 28px}
footer{padding:32px 0;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
/* neon lights */
body{background:radial-gradient(900px 500px at 85% -5%,var(--glow),transparent 60%),radial-gradient(700px 500px at -10% 40%,rgba(232,255,26,.10),transparent 60%),var(--bg);background-attachment:fixed}
header{box-shadow:0 1px 0 var(--accent),0 4px 22px -6px var(--glow)}
.logo span{animation:flick 5s infinite}
@keyframes flick{0%,18%,22%,62%,64%,100%{opacity:1;text-shadow:0 0 8px var(--accent),0 0 22px var(--accent)}20%,63%{opacity:.45;text-shadow:none}}
.hero h1 em{text-shadow:0 0 10px var(--accent),0 0 34px var(--accent),0 0 70px var(--glow)}
.hero::after{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 22px 4px var(--glow)}
.btn-primary{box-shadow:0 0 12px var(--accent),0 0 34px var(--glow)}
.btn-primary:hover{box-shadow:0 0 18px var(--accent),0 0 54px var(--glow)}
.btn-ghost:hover,.plan:not(.hot) .btn:hover{border-color:var(--accent);box-shadow:0 0 16px var(--glow)}
.plan{transition:transform .2s,box-shadow .2s,border-color .2s}
.plan:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 0 28px var(--glow)}
.plan.hot{box-shadow:0 0 0 1px var(--accent),0 0 18px var(--accent),0 0 60px var(--glow)}
.tag{box-shadow:0 0 16px var(--accent)}
.plan li::before{text-shadow:0 0 8px var(--accent)}
.price{text-shadow:0 0 18px var(--glow)}
.eyebrow,.stats b,.step .n{text-shadow:0 0 12px var(--accent)}
.feat:hover{border-color:var(--accent);box-shadow:0 0 22px var(--glow)}
.step:hover{box-shadow:0 -6px 18px -8px var(--accent)}
.screen{box-shadow:0 0 18px var(--accent),inset 0 0 26px var(--glow)}
details[open]{border-color:var(--accent);box-shadow:0 0 20px var(--glow)}
summary::after{text-shadow:0 0 10px var(--accent)}
.final{box-shadow:0 0 0 1px var(--accent),0 0 28px var(--accent),0 0 90px var(--glow)}
/* 404 */
#erro-404{display:none;min-height:calc(100vh - 140px);padding:72px 0;text-align:center;place-items:center;position:relative;overflow:hidden}
#erro-404::before{content:"";position:absolute;width:620px;height:620px;left:50%;top:40%;transform:translate(-50%,-50%);background:radial-gradient(circle,var(--glow),transparent 62%);pointer-events:none}
body.is-404 main>*:not(#erro-404){display:none}
body.is-404 #erro-404{display:grid}
.e404{position:relative}
.e404 .big{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:clamp(96px,26vw,250px);line-height:1;letter-spacing:.04em;margin:8px 0 4px}
.e404 .big span{color:var(--accent);animation:flick 5s infinite}
.e404 h1{font-size:clamp(26px,4.5vw,40px)}
.e404 p{color:var(--muted);max-width:460px;margin:14px auto 28px}
.e404 .cta{justify-content:center}
.e404 .quick{margin-top:30px;display:flex;gap:22px;justify-content:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.e404 .quick a:hover{color:var(--accent);text-shadow:0 0 10px var(--accent)}
</style>
</head>
<body class="is-404">
<header>
  <div class="wrap nav">
    <a class="logo" href="/">NE<span>O</span>M</a>
    <nav class="links"><a href="/#planos">Planos</a><a href="/#como-funciona">Como funciona</a><a href="/#duvidas">Dúvidas</a></nav>
    <a class="btn btn-primary" href="/#planos">Quero meu site</a>
  </div>
</header>
<main>

    <div class="cta"><a class="btn btn-primary" href="/">Voltar para o início</a><a class="btn btn-ghost" href="https://wa.me/5583994054176?text=Ol%C3%A1!%20Quero%20saber%20mais%20sobre%20os%20sites.">Falar no WhatsApp</a></div>
    <div class="quick"><a href="/#planos">Planos</a><a href="/#como-funciona">Como funciona</a><a href="/#duvidas">Dúvidas</a></div>
  </div>
</section>
</main>
</body>
</html>
